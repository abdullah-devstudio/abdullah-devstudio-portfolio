<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Projects — Abdullah Dev Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            inter:   ['Inter', 'sans-serif'],
            fira:    ['"Fira Code"', 'monospace'],
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="font-inter antialiased min-h-screen">

<!-- Page header -->
<header id="navbar" class="sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 text-sm font-medium btn-outline !py-2 !px-4">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span data-i18n="projects.backHome">← Back to Home</span>
    </a>
    <div class="flex items-center gap-2">
      <a href="index.html" class="hidden sm:flex items-center gap-2">
        <img src="assets/logo.png" alt="Logo" class="h-8 w-auto" />
        <span class="font-bold font-poppins text-primary text-base">Abdullah Dev Studio</span>
      </a>
      <button data-lang-toggle class="btn-lang ml-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        <span id="lang-btn-text">اردو</span>
      </button>
      <button data-theme-toggle class="btn-icon !w-8 !h-8" aria-label="Toggle Theme">
        <span id="theme-icon"></span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">

  <!-- Page title -->
  <div class="text-center mb-16 fade-up">
    <h1 class="text-4xl md:text-5xl font-bold font-poppins text-foreground mb-4" data-i18n="projects.pageTitle">All Projects</h1>
    <p class="text-lg max-w-2xl mx-auto" style="color:var(--muted)" data-i18n="projects.pageSubtitle">
      A collection of work I've built — from real-world applications to experimental ideas.
    </p>
    <div class="mt-6 w-16 h-1 rounded-full mx-auto" style="background:var(--primary)"></div>
  </div>

  <!-- Projects grid -->
  <div id="public-projects-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8 stagger" aria-live="polite">

    <div class="public-projects-state card fade-up" role="status">
      Loading projects…
    </div>
  </div>

  <!-- Back to home -->
  <div class="text-center mt-20 fade-up">
    <a href="index.html" class="btn-primary gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span data-i18n="projects.backHome">← Back to Home</span>
    </a>
  </div>
</main>

<!-- Mobile lang btn (mobile header uses id=lang-btn-text-mobile) -->
<span id="lang-btn-text-mobile" style="display:none"></span>
<span id="theme-icon-mobile" style="display:none"></span>

<script src="app.js"></script>
<script type="module" src="public-projects.js"></script>
</body>
</html>
